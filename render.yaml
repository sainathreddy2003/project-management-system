services:
  # 1. Backend Express API Web Service
  - type: web
    name: pms-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_EXPIRES_DAYS
        value: 7
      - key: CORS_ORIGIN
        value: "https://*.onrender.com,http://localhost:5173,http://localhost:3000"
      - key: DB_SSL
        value: "true"
      - key: AUTO_SEED
        value: "true"
      - key: DATABASE_URL
        sync: false

  # 2. Frontend React (Vite) Static Site
  - type: web
    name: pms-web
    runtime: static
    plan: free
    region: oregon
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: pms-backend
          envVarKey: RENDER_EXTERNAL_URL

