version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: pms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: project_management_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pms-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: project_management_db
      JWT_SECRET: pms-super-secure-production-ready-jwt-secret-key-2026
      JWT_EXPIRES_IN: 15m
      REFRESH_EXPIRES_DAYS: 7
      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://localhost:80
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "npm run db:init && npm run db:seed && npm start"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5001/api
    container_name: pms-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:

